# lt-pg: Postgres 18.6 for a write-heavy, short-transaction OLTP load inside a 1 vCPU / 2 GB container.
# Each parameter carries its reason. [measured] = kept because a run supported it; [correctness] = kept
# whatever the numbers say; [sizing] = derived from the container cap; [observability] = for the report.
# REPORT.md section "Postgres 設定" holds the A/B numbers and the RDS mapping.

# --- connections ---
# [sizing] containers reach lt-pg over the lt-net bridge only; the host publishes 127.0.0.1 only.
listen_addresses = '*'
# [sizing] pools sum to 22 (decision 8, payments 4, scheduler 2 x 4, tools 2); fewer slots, less per-backend memory.
max_connections = 60

# --- memory ---
# [sizing] 25% of the 2 GB cap; the whole working set (tens of MB) stays resident.
shared_buffers = 512MB
# [sizing] planner hint: shared_buffers plus the page cache that fits under the cap.
effective_cache_size = 1536MB
# [sizing] per sort/hash node; 60 x 8 MB worst case still fits under the cap.
work_mem = 8MB
# [sizing] faster vacuum and index builds; one autovacuum worker uses it at a time.
maintenance_work_mem = 128MB

# --- WAL and checkpoints ---
# wal_compression: removed. Measured WAL per transaction 1,203 B (zstd) vs 1,213 B (off) and equal TPS,
# because full-page images are a small share of this WAL; it is left at the default (off).
# [measured] fewer forced checkpoints, so fewer full-page-image bursts.
checkpoint_timeout = 15min
# [measured] room for 15 minutes of WAL at T4 rates without a requested checkpoint.
max_wal_size = 4GB
# [sizing] keeps recycled segments instead of creating new files after each checkpoint.
min_wal_size = 1GB
# [measured] spreads checkpoint writes over 90% of the interval.
checkpoint_completion_target = 0.9
# [measured] lz4 is cheaper than pglz for the msgpack bodies that cross the TOAST threshold.
default_toast_compression = lz4
# [correctness] decisions, outbox, payments and entitlements must survive a crash. Rebuildable data
# (Context, recent events in the T6b variant) sets synchronous_commit = off per transaction instead.
synchronous_commit = on

# --- planner and I/O ---
# [sizing] SSD-backed block volume: an index page costs about the same as a sequential one.
random_page_cost = 1.1
# [sizing] lets bitmap heap scans and prefetch keep several reads in flight.
effective_io_concurrency = 200
# [measured] PG18 async I/O; worker is the default, io_uring needs liburing and a seccomp profile (compared).
io_method = worker
# [measured] I/O worker processes for io_method = worker (default 3).
io_workers = 3
# [measured] JIT compiles plans that run for microseconds: pure overhead for OLTP.
jit = off

# --- autovacuum ---
# [measured] wake every 10 s: new or fast-growing tables get ANALYZE/VACUUM within seconds. Together with
# the cost limit below this is the whole measured gain of the tuned config: pgbench decide path
# 1,016-1,038 TPS (defaults) vs 1,547-1,737 TPS (tuned); tuned with these two reset: 1,024 TPS.
autovacuum_naptime = 10s
# [measured] let a vacuum run 10x the default cost budget before sleeping, so it finishes quickly.
autovacuum_vacuum_cost_limit = 2000

# --- observability ---
# [observability] per-statement timings for the index audit and the A/B tables.
shared_preload_libraries = 'pg_stat_statements'
# [observability] top-level statements only; the services issue no nested statements.
pg_stat_statements.track = top
# [observability] I/O timing columns in pg_stat_io and pg_stat_statements.
track_io_timing = on
# [observability] log every autovacuum run (counts for the report).
log_autovacuum_min_duration = 0
# [observability] log statements slower than 250 ms.
log_min_duration_statement = 250
# [observability] checkpoint log lines (PG18 default on, stated explicitly).
log_checkpoints = on
# [correctness] timestamps in UTC.
timezone = 'UTC'
log_timezone = 'UTC'
