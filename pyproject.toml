[project]
name = "lt-loadtest"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "sanic==25.12.1",
    "msgspec==0.22.0",
    "redis[hiredis]==8.1.0",
    "psqlpy==0.12.1",
    "uvloop==0.23.0",
    "loguru>=0.7.3",
    "xxhash>=4.0.1",
    "cachebox>=6.2.7",
    "rnet>=2.4.2",
    "valkey-glide>=2.5.3",
    "granian>=2.8.4",
    "py-spy>=0.4.2",
]

[dependency-groups]
dev = [
    "aiohttp>=3.12",
    "fakeredis[lua]>=2.32",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
