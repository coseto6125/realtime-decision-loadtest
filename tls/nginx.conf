# TLS terminator in front of lt-model (T7). Test-only self-signed certificate from scripts/make_test_cert.sh.
worker_processes 1;
events { worker_connections 4096; }
http {
  access_log off;
  upstream model { server lt-model:8000; keepalive 64; }
  server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.3;
    keepalive_timeout 75s;
    keepalive_requests 100000;
    location / { proxy_pass http://model; proxy_http_version 1.1; proxy_set_header Connection ""; }
  }
}
